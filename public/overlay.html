<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Coding Stats — overlay для OBS</title>
<style>
  :root{
    --accent:#9146ff;
    --accent-2:#bf94ff;
    --bg:rgba(14,12,20,.82);
    --line:rgba(255,255,255,.10);
    --text:#f4f1ff;
    --muted:#a79fd0;
    --green:#3ddc97;
    --red:#ff6b81;
    --scale:1;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{
    margin:0;padding:0;background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:var(--text);overflow:hidden;
  }
  body{padding:18px;display:inline-block}
  .widget{
    width:430px;transform:scale(var(--scale));transform-origin:top left;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px 14px;
    backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 22px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;overflow:hidden;
    animation:enter .55s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes enter{from{opacity:0;transform:translateY(-12px) scale(var(--scale))}to{opacity:1;transform:translateY(0) scale(var(--scale))}}
  .widget::before{
    content:"";position:absolute;inset:0 auto auto 0;height:2px;width:100%;
    background:linear-gradient(90deg,transparent,var(--accent),#00e5ff,transparent);
    background-size:200% 100%;animation:shimmer 6s linear infinite;opacity:.85;
  }
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

  /* ── строка статуса ── */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .chan{display:flex;align-items:center;gap:9px;min-width:0}
  .pill{
    display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
    font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 8px;border-radius:7px;
  }
  .pill.live{background:rgba(255,45,85,.16);color:#ff6b86;border:1px solid rgba(255,45,85,.4)}
  .pill.off{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.live .dot{animation:pulse 1.4s ease-in-out infinite;box-shadow:0 0 0 0 rgba(255,45,85,.7)}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,45,85,.65)}
    70%{box-shadow:0 0 0 7px rgba(255,45,85,0)}
    100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}
  }
  .name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
  .viewers{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:700;color:var(--muted);
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    padding:4px 9px;border-radius:8px;
  }

  /* ── репозиторий ── */
  .repo{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.045);
    border:1px solid var(--line);margin-bottom:12px;
  }
  .repo-id{display:flex;align-items:center;gap:8px;min-width:0}
  .gh{flex:0 0 auto;opacity:.85}
  .repo-name{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lang{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:2px}
  .lang i{width:7px;height:7px;border-radius:50%;background:#3178c6;display:inline-block}
  .stars{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:750;color:#ffd166;flex:0 0 auto}

  /* ── цифры ── */
  .nums{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:9px;margin-bottom:11px}
  .cell{padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
  .cell .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
  .cell .v{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
  .cell .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}
  .cell.add .v{color:var(--green)}
  .cell.del .v{color:var(--red)}
  .cell .sub{font-size:10.5px;color:var(--muted);margin-top:2px}

  /* ── последний коммит ── */
  .commit{
    display:flex;align-items:flex-start;gap:8px;padding-top:10px;
    border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.45;
  }
  .commit b{color:var(--text);font-weight:650}
  .commit .msg{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .branch{
    flex:0 0 auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px;color:var(--accent-2);background:rgba(145,70,255,.14);
    border:1px solid rgba(145,70,255,.3);border-radius:5px;padding:1px 5px;margin-top:1px;
  }

  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:10px;color:rgba(167,159,208,.7)}
  .foot .tag{color:var(--accent-2);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .foot .tag.demo{color:#ffd166}
  .state{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  body.loading .widget{opacity:.6}
</style>
</head>
<body class="loading">
<div class="widget" id="widget">
  <div class="top">
    <div class="chan">
      <span class="pill live" id="pill"><span class="dot"></span><span id="pillText">live</span></span>
      <div class="name" id="channel">channel<small id="title">заголовок стрима</small></div>
    </div>
    <div class="viewers">👀 <span id="viewers">0</span></div>
  </div>

  <div class="repo">
    <div class="repo-id">
      <svg class="gh" width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      <div style="min-width:0">
        <div class="repo-name" id="repo">owner/repo</div>
        <div class="lang"><i id="langDot"></i><span id="lang">—</span></div>
      </div>
    </div>
    <div class="stars">★ <span id="stars">0</span></div>
  </div>

  <div class="nums">
    <div class="cell">
      <div class="k">коммиты</div>
      <div class="v"><span id="commits">0</span><small id="window">/24ч</small></div>
      <div class="sub" id="prs">PR: 0</div>
    </div>
    <div class="cell add">
      <div class="k">добавлено</div>
      <div class="v">+<span id="adds">0</span></div>
      <div class="sub">строк</div>
    </div>
    <div class="cell del">
      <div class="k">удалено</div>
      <div class="v">−<span id="dels">0</span></div>
      <div class="sub">строк</div>
    </div>
  </div>

  <div class="commit">
    <span class="branch" id="branch">main</span>
    <span class="msg"><b id="author">—</b> · <span id="message">последний коммит</span></span>
  </div>

  <div class="foot">
    <span class="tag" id="tag">github</span>
    <span id="updated">обновлено только что</span>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const accent = params.get('accent');
  if (accent) {
    document.documentElement.style.setProperty('--accent', '#' + accent.replace('#', ''));
  }
  const scale = Number(params.get('scale') || 1);
  if (Number.isFinite(scale) && scale > 0) {
    document.documentElement.style.setProperty('--scale', String(scale));
  }
  if (params.get('compact') === '1') {
    document.querySelectorAll('.commit, .foot').forEach((el) => (el.style.display = 'none'));
  }

  // Демо-данные: показываются, если API недоступен (например, при открытии файла напрямую)
  const FALLBACK = {
    demo: true,
    channel: {
      live: true,
      displayName: 'Your Channel',
      title: 'Пишу GitHub-интеграцию для стрима',
      game: 'Software and Game Development',
      viewers: 1284,
    },
    repo: {
      fullName: 'octocat/Hello-World',
      stars: 2741,
      language: 'TypeScript',
      pullRequests: { count: 3 },
      activity: {
        windowHours: 24,
        commits: 17,
        additions: 1462,
        deletions: 318,
        latestCommit: { message: 'feat(overlay): плавная анимация счётчиков', author: 'octocat' },
      },
    },
  };

  const el = (id) => document.getElementById(id);
  const fmt = (n) => new Intl.NumberFormat('ru-RU').format(Number(n) || 0);
  const LANG_COLORS = {
    TypeScript: '#3178c6', JavaScript: '#f1e05a', Python: '#3572A5', Rust: '#dea584',
    Go: '#00ADD8', 'C++': '#f34b7d', C: '#555555', 'C#': '#178600', HTML: '#e34c26',
    CSS: '#563d7c', Shell: '#89e051', Vue: '#41b883', Svelte: '#ff3e00', Java: '#b07219',
  };

  function countUp(node, to, ms = 700) {
    const from = Number(String(node.textContent).replace(/\D/g, '')) || 0;
    const start = performance.now();
    const step = (now) => {
      const p = Math.min((now - start) / ms, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      node.textContent = fmt(Math.round(from + (to - from) * eased));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  let updatedAt = Date.now();

  function render(data) {
    const channel = data.channel || FALLBACK.channel;
    const repo = data.repo || FALLBACK.repo;
    const activity = repo.activity || FALLBACK.repo.activity;

    const pill = el('pill');
    pill.className = 'pill ' + (channel.live ? 'live' : 'off');
    el('pillText').textContent = channel.live ? 'live' : 'offline';
    el('channel').firstChild.textContent = channel.displayName || channel.login || 'channel';
    el('title').textContent = channel.live
      ? (channel.title || '') + (channel.game ? ' · ' + channel.game : '')
      : 'офлайн';
    el('viewers').textContent = fmt(channel.viewers || 0);

    el('repo').textContent = repo.fullName || 'owner/repo';
    const lang = repo.language || '—';
    el('lang').textContent = lang;
    el('langDot').style.background = LANG_COLORS[lang] || '#8b7bb8';

    countUp(el('stars'), repo.stars || 0);
    countUp(el('commits'), activity.commits || 0);
    countUp(el('adds'), activity.additions || 0);
    countUp(el('dels'), activity.deletions || 0);
    el('window').textContent = '/' + (activity.windowHours || 24) + 'ч';
    el('prs').textContent = 'PR: ' + (repo.pullRequests?.count ?? 0);

    const last = activity.latestCommit;
    el('author').textContent = last ? last.author : '—';
    el('message').textContent = last ? last.message : 'нет коммитов за период';

    el('tag').textContent = data.demo ? 'demo data' : 'github';
    el('tag').className = 'tag' + (data.demo ? ' demo' : '');

    updatedAt = Date.now();
    tickUpdated();
    document.body.classList.remove('loading');
  }

  function tickUpdated() {
    const sec = Math.round((Date.now() - updatedAt) / 1000);
    el('updated').textContent =
      sec < 5 ? 'обновлено только что' : sec < 60 ? 'обновлено ' + sec + ' с назад' : 'обновлено ' + Math.round(sec / 60) + ' мин назад';
  }
  setInterval(tickUpdated, 5000);

  // ?api=https://твой-сервер/api/stats — если оверлей открыт не с того же сервера (например, с GitHub Pages)
  const apiUrl = params.get('api') || 'api/stats';

  async function load() {
    try {
      const response = await fetch(apiUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      render(await response.json());
    } catch {
      render(FALLBACK);
    }
  }

  load();
  // OBS держит страницу открытой часами — обновляем сами
  setInterval(load, Number(params.get('refresh') || 30) * 1000);
})();
</script>
</body>
</html>
