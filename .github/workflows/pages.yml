name: Галерея клипов → GitHub Pages

# Идея D: при изменении data/clips.json (бот добавил клип) пересобираем страницу.
# В Settings → Pages выбери Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'data/clips.json'
      - 'public/**'
      - 'src/gallery.js'
      - 'scripts/build-gallery.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Собрать gallery.html
        env:
          TWITCH_CHANNEL: ${{ vars.TWITCH_CHANNEL }}
          GITHUB_REPO: ${{ github.repository }}
          GALLERY_PARENTS: ${{ vars.GALLERY_PARENTS }}
        run: node scripts/build-gallery.js

      - name: Проверить, что страница собралась
        run: test -f public/gallery.html && echo "ok: public/gallery.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
